<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1240" height="810" fill="#ffffff"/>
  <text x="620" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Буровой раствор: CPU-пайплайн против GPU v2</text>

  <!-- ======================= LEFT PANEL: CPU ======================= -->
  <text x="320" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#333">CPU: 640 отдельных задач — в каждой раствор = одна константа</text>

  <!-- reference RM(z) log bar -->
  <text x="60" y="112" text-anchor="middle" font-size="12" fill="#555">лог RM(z)</text>
  <g stroke="none">
    <rect x="48" y="122" width="24" height="30" fill="hsl(210,60%,55%)"/>
    <rect x="48" y="152" width="24" height="30" fill="hsl(210,60%,45%)"/>
    <rect x="48" y="182" width="24" height="30" fill="hsl(210,60%,60%)"/>
    <rect x="48" y="212" width="24" height="30" fill="hsl(210,60%,40%)"/>
    <rect x="48" y="242" width="24" height="30" fill="hsl(210,60%,52%)"/>
    <rect x="48" y="272" width="24" height="30" fill="hsl(210,60%,63%)"/>
    <rect x="48" y="302" width="24" height="30" fill="hsl(210,60%,44%)"/>
    <rect x="48" y="332" width="24" height="30" fill="hsl(210,60%,57%)"/>
    <rect x="48" y="362" width="24" height="30" fill="hsl(210,60%,48%)"/>
    <rect x="48" y="392" width="24" height="30" fill="hsl(210,60%,62%)"/>
    <rect x="48" y="422" width="24" height="30" fill="hsl(210,60%,42%)"/>
    <rect x="48" y="452" width="24" height="30" fill="hsl(210,60%,54%)"/>
    <rect x="48" y="482" width="24" height="30" fill="hsl(210,60%,65%)"/>
    <rect x="48" y="512" width="24" height="30" fill="hsl(210,60%,46%)"/>
    <rect x="48" y="542" width="24" height="30" fill="hsl(210,60%,58%)"/>
    <rect x="48" y="572" width="24" height="30" fill="hsl(210,60%,50%)"/>
  </g>
  <rect x="48" y="122" width="24" height="480" fill="none" stroke="#666" stroke-width="1"/>
  <text x="60" y="618" text-anchor="middle" font-size="11" fill="#777">меняется</text>
  <text x="60" y="632" text-anchor="middle" font-size="11" fill="#777">с глубиной</text>

  <!-- np.interp arrows to windows -->
  <path d="M 76 260 C 110 250, 125 240, 148 232" stroke="#c05050" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="106" y="228" font-size="11" fill="#c05050">interp в одной точке —</text>
  <text x="106" y="242" font-size="11" fill="#c05050">на глубине прибора</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c05050"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <!-- three mini-domains -->
  <!-- box 1 -->
  <g>
    <text x="215" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#444">расчёт №1 (z=10.0)</text>
    <g>
      <rect x="150" y="160" width="130" height="47.5" fill="#dbc9a8"/>
      <rect x="150" y="207.5" width="130" height="47.5" fill="#c3a87f"/>
      <rect x="150" y="255" width="130" height="47.5" fill="#e3d7bd"/>
      <rect x="150" y="302.5" width="130" height="47.5" fill="#a98f6b"/>
      <rect x="150" y="350" width="130" height="47.5" fill="#d6c39e"/>
      <rect x="150" y="397.5" width="130" height="47.5" fill="#c9b189"/>
      <rect x="150" y="445" width="130" height="47.5" fill="#efe6d2"/>
      <rect x="150" y="492.5" width="130" height="47.5" fill="#b79d75"/>
    </g>
    <rect x="150" y="160" width="22" height="380" fill="hsl(210,60%,52%)"/>
    <rect x="150" y="160" width="130" height="380" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
    <circle cx="153" cy="330" r="4.4" fill="#d63b3b"/>
    <circle cx="153" cy="348" r="3" fill="#333"/>
    <circle cx="153" cy="357" r="3" fill="#333"/>
    <text x="163" y="334" font-size="10.5" fill="#d63b3b">A</text>
    <text x="163" y="352" font-size="10.5" fill="#333">M</text>
    <text x="163" y="363" font-size="10.5" fill="#333">N</text>
    <text x="215" y="558" text-anchor="middle" font-size="12.5" fill="#2a5d97" font-weight="600">RM = 0.75 везде</text>
  </g>
  <!-- box 2 -->
  <g>
    <text x="365" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#444">расчёт №2 (z=10.2)</text>
    <g>
      <rect x="300" y="160" width="130" height="47.5" fill="#dbc9a8"/>
      <rect x="300" y="207.5" width="130" height="47.5" fill="#c3a87f"/>
      <rect x="300" y="255" width="130" height="47.5" fill="#e3d7bd"/>
      <rect x="300" y="302.5" width="130" height="47.5" fill="#a98f6b"/>
      <rect x="300" y="350" width="130" height="47.5" fill="#d6c39e"/>
      <rect x="300" y="397.5" width="130" height="47.5" fill="#c9b189"/>
      <rect x="300" y="445" width="130" height="47.5" fill="#efe6d2"/>
      <rect x="300" y="492.5" width="130" height="47.5" fill="#b79d75"/>
    </g>
    <rect x="300" y="160" width="22" height="380" fill="hsl(210,60%,40%)"/>
    <rect x="300" y="160" width="130" height="380" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
    <circle cx="303" cy="344" r="4.4" fill="#d63b3b"/>
    <circle cx="303" cy="362" r="3" fill="#333"/>
    <circle cx="303" cy="371" r="3" fill="#333"/>
    <text x="365" y="558" text-anchor="middle" font-size="12.5" fill="#1d4570" font-weight="600">RM = 0.81 везде</text>
  </g>
  <!-- box 3 -->
  <g>
    <text x="515" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#444">расчёт №3 (z=10.4)</text>
    <g>
      <rect x="450" y="160" width="130" height="47.5" fill="#dbc9a8"/>
      <rect x="450" y="207.5" width="130" height="47.5" fill="#c3a87f"/>
      <rect x="450" y="255" width="130" height="47.5" fill="#e3d7bd"/>
      <rect x="450" y="302.5" width="130" height="47.5" fill="#a98f6b"/>
      <rect x="450" y="350" width="130" height="47.5" fill="#d6c39e"/>
      <rect x="450" y="397.5" width="130" height="47.5" fill="#c9b189"/>
      <rect x="450" y="445" width="130" height="47.5" fill="#efe6d2"/>
      <rect x="450" y="492.5" width="130" height="47.5" fill="#b79d75"/>
    </g>
    <rect x="450" y="160" width="22" height="380" fill="hsl(210,60%,61%)"/>
    <rect x="450" y="160" width="130" height="380" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
    <circle cx="453" cy="358" r="4.4" fill="#d63b3b"/>
    <circle cx="453" cy="376" r="3" fill="#333"/>
    <circle cx="453" cy="385" r="3" fill="#333"/>
    <text x="515" y="558" text-anchor="middle" font-size="12.5" fill="#3a72ad" font-weight="600">RM = 0.78 везде</text>
  </g>
  <text x="600" y="355" font-size="17" font-weight="700" fill="#666">…×640</text>

  <text x="365" y="586" text-anchor="middle" font-size="12" fill="#666">пунктир: u=0 на границе R=40 — близко (для длинных зондов это больно)</text>
  <text x="365" y="603" text-anchor="middle" font-size="12" fill="#666">каждый расчёт заново: меш → сборка → факторизация → решение</text>

  <!-- ======================= RIGHT PANEL: GPU ======================= -->
  <text x="935" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#333">GPU v2: одна глобальная задача — раствор как в реальности</text>

  <!-- outer far boundary -->
  <rect x="680" y="122" width="500" height="500" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1172" y="138" text-anchor="end" font-size="11.5" fill="#777">u=0 на R=720 — «почти бесконечность» (ошибка ≤0.07%)</text>

  <!-- strata across the full width (well section) -->
  <g>
    <rect x="700" y="170" width="460" height="52.5" fill="#dbc9a8"/>
    <rect x="700" y="222.5" width="460" height="52.5" fill="#c3a87f"/>
    <rect x="700" y="275" width="460" height="52.5" fill="#e3d7bd"/>
    <rect x="700" y="327.5" width="460" height="52.5" fill="#a98f6b"/>
    <rect x="700" y="380" width="460" height="52.5" fill="#d6c39e"/>
    <rect x="700" y="432.5" width="460" height="52.5" fill="#c9b189"/>
    <rect x="700" y="485" width="460" height="52.5" fill="#efe6d2"/>
    <rect x="700" y="537.5" width="460" height="52.5" fill="#b79d75"/>
  </g>

  <!-- geometric mesh-growth guide lines -->
  <g stroke="#00000018" stroke-width="1">
    <line x1="730" y1="170" x2="730" y2="590"/>
    <line x1="742" y1="170" x2="742" y2="590"/>
    <line x1="758" y1="170" x2="758" y2="590"/>
    <line x1="780" y1="170" x2="780" y2="590"/>
    <line x1="812" y1="170" x2="812" y2="590"/>
    <line x1="858" y1="170" x2="858" y2="590"/>
    <line x1="922" y1="170" x2="922" y2="590"/>
    <line x1="1010" y1="170" x2="1010" y2="590"/>
    <line x1="1120" y1="170" x2="1120" y2="590"/>
  </g>

  <!-- borehole column with TRUE striped profile -->
  <g>
    <rect x="700" y="170" width="22" height="26.25" fill="hsl(210,60%,55%)"/>
    <rect x="700" y="196.25" width="22" height="26.25" fill="hsl(210,60%,45%)"/>
    <rect x="700" y="222.5" width="22" height="26.25" fill="hsl(210,60%,60%)"/>
    <rect x="700" y="248.75" width="22" height="26.25" fill="hsl(210,60%,40%)"/>
    <rect x="700" y="275" width="22" height="26.25" fill="hsl(210,60%,52%)"/>
    <rect x="700" y="301.25" width="22" height="26.25" fill="hsl(210,60%,63%)"/>
    <rect x="700" y="327.5" width="22" height="26.25" fill="hsl(210,60%,44%)"/>
    <rect x="700" y="353.75" width="22" height="26.25" fill="hsl(210,60%,57%)"/>
    <rect x="700" y="380" width="22" height="26.25" fill="hsl(210,60%,48%)"/>
    <rect x="700" y="406.25" width="22" height="26.25" fill="hsl(210,60%,62%)"/>
    <rect x="700" y="432.5" width="22" height="26.25" fill="hsl(210,60%,42%)"/>
    <rect x="700" y="458.75" width="22" height="26.25" fill="hsl(210,60%,54%)"/>
    <rect x="700" y="485" width="22" height="26.25" fill="hsl(210,60%,65%)"/>
    <rect x="700" y="511.25" width="22" height="26.25" fill="hsl(210,60%,46%)"/>
    <rect x="700" y="537.5" width="22" height="26.25" fill="hsl(210,60%,58%)"/>
    <rect x="700" y="563.75" width="22" height="26.25" fill="hsl(210,60%,50%)"/>
  </g>

  <!-- sources along the axis -->
  <g fill="#d63b3b">
    <circle cx="702" cy="180" r="3"/><circle cx="702" cy="202" r="3"/><circle cx="702" cy="224" r="3"/>
    <circle cx="702" cy="246" r="3"/><circle cx="702" cy="268" r="3"/><circle cx="702" cy="290" r="3"/>
    <circle cx="702" cy="312" r="3"/><circle cx="702" cy="334" r="3"/><circle cx="702" cy="356" r="3"/>
    <circle cx="702" cy="378" r="3"/><circle cx="702" cy="400" r="3"/><circle cx="702" cy="422" r="3"/>
    <circle cx="702" cy="444" r="3"/><circle cx="702" cy="466" r="3"/><circle cx="702" cy="488" r="3"/>
    <circle cx="702" cy="510" r="3"/><circle cx="702" cy="532" r="3"/><circle cx="702" cy="554" r="3"/>
    <circle cx="702" cy="576" r="3"/>
  </g>

  <!-- annotations right panel -->
  <path d="M 760 640 C 745 630, 735 615, 715 596" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arrg)"/>
  <text x="765" y="652" font-size="12" fill="#555">531 источник (все глубины × все зонды) = колонки правых частей</text>
  <path d="M 985 660 C 960 655, 940 648, 930 624" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arrg)"/>
  <text x="990" y="668" font-size="12" fill="#555">одна сетка, одна факторизация A = LL&#7511; на весь сэмпл</text>
  <text x="820" y="163" font-size="11.5" fill="#2a5d97" font-weight="600">колонна раствора = настоящий профиль RM(z)</text>
  <text x="1000" y="605" text-anchor="middle" font-size="11" fill="#888">ячейки растут к границе — far-field почти бесплатен</text>

  <!-- ======================= BOTTOM: pipelines ======================= -->
  <line x1="40" y1="690" x2="1200" y2="690" stroke="#ddd" stroke-width="1"/>
  <text x="46" y="722" font-size="13.5" font-weight="700" fill="#444">CPU:</text>
  <g font-size="12" fill="#333">
    <rect x="95"  y="706" width="72" height="24" rx="5" fill="#f0ece2" stroke="#bbb"/><text x="131" y="722" text-anchor="middle">меш</text>
    <rect x="187" y="706" width="72" height="24" rx="5" fill="#f0ece2" stroke="#bbb"/><text x="223" y="722" text-anchor="middle">сборка</text>
    <rect x="279" y="706" width="72" height="24" rx="5" fill="#f0ece2" stroke="#bbb"/><text x="315" y="722" text-anchor="middle">LL&#7511;</text>
    <rect x="371" y="706" width="80" height="24" rx="5" fill="#f0ece2" stroke="#bbb"/><text x="411" y="722" text-anchor="middle">решение</text>
    <path d="M 167 718 L 183 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 259 718 L 275 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 351 718 L 367 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 451 718 C 480 718, 480 740, 411 740 L 131 740 C 95 740, 95 730, 112 730" stroke="#c05050" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="290" y="756" text-anchor="middle" font-size="12" fill="#c05050">повторить 640 раз (у каждой глубины — своя константа RM и свой меш)</text>
    <text x="530" y="722" font-size="13.5" font-weight="700" fill="#444">= 29.2 s/сэмпл</text>
  </g>
  <text x="666" y="722" font-size="13.5" font-weight="700" fill="#444">GPU:</text>
  <g font-size="12" fill="#333">
    <rect x="715" y="706" width="72" height="24" rx="5" fill="#e4edf6" stroke="#9db8d2"/><text x="751" y="722" text-anchor="middle">&#963;(r,z)</text>
    <rect x="807" y="706" width="72" height="24" rx="5" fill="#e4edf6" stroke="#9db8d2"/><text x="843" y="722" text-anchor="middle">сборка</text>
    <rect x="899" y="706" width="80" height="24" rx="5" fill="#e4edf6" stroke="#9db8d2"/><text x="939" y="722" text-anchor="middle">LL&#7511; ×1</text>
    <rect x="999" y="706" width="120" height="24" rx="5" fill="#e4edf6" stroke="#9db8d2"/><text x="1059" y="722" text-anchor="middle">531 RHS разом</text>
    <path d="M 787 718 L 803 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 879 718 L 895 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 979 718 L 995 718" stroke="#888" stroke-width="1.4" marker-end="url(#arrg)"/>
    <text x="917" y="756" text-anchor="middle" font-size="12" fill="#2a5d97">ничего не повторяется: батч по сэмплам через vmap</text>
    <text x="1128" y="722" font-size="13.5" font-weight="700" fill="#444">= 0.74 s/сэмпл</text>
  </g>

  <text x="620" y="792" text-anchor="middle" font-size="12" fill="#888">Синее = буровой раствор (оттенок = RM), бежевое = пласты формации, красные точки = токовые электроды, пунктир = граница u=0</text>
</svg>
